[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "basalt-aws"
version = "0.1.0"
description = "Read-only AWS posture scanner for IAM, S3, CloudTrail and KMS, emitting normalized Basalt findings."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Kingsley Okafor" }]
keywords = ["aws", "security", "cspm", "iam", "s3", "cloudtrail", "kms", "sarif", "ocsf"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Typing :: Typed",
]
dependencies = [
    "basalt-core>=0.1.1,<1",
    "boto3>=1.34",
    "botocore>=1.34",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "moto[s3,iam,cloudtrail,kms,sts]>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "boto3-stubs[s3,iam,cloudtrail,kms,sts]>=1.34",
    "build>=1.2",
]

[project.scripts]
basalt-aws = "basalt_aws.cli:main"

# Discovered by basalt-core; this is what makes `basalt scanners` list us.
[project.entry-points."basalt.scanners"]
aws = "basalt_aws.scanner:AwsScanner"

[project.urls]
Homepage = "https://github.com/kingsokafor777-droid/basalt-aws"
Source = "https://github.com/kingsokafor777-droid/basalt-aws"
Issues = "https://github.com/kingsokafor777-droid/basalt-aws/issues"
Changelog = "https://github.com/kingsokafor777-droid/basalt-aws/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/basalt_aws"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/docs", "/terraform", "/README.md", "/LICENSE", "/CHANGELOG.md"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "RUF", "ARG", "PTH"]
# UP042/UP017: 3.11-only constructs; the floor here matches basalt-core at 3.10.
ignore = ["N818", "RUF012", "A003", "RUF022", "UP042", "UP017"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG", "PTH", "S101"]
# ARG002: Check.run's signature is fixed by the ABC; global-scope checks ignore `region`.
"src/basalt_aws/checks/*" = ["ARG002"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
files = ["src/basalt_aws"]

[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*", "moto.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["live: requires real AWS credentials; deselected by default"]

[tool.coverage.run]
source = ["basalt_aws"]
branch = true

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
fail_under = 80
