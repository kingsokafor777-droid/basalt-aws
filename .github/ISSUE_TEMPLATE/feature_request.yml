name: Feature request
description: Propose a change or addition
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is difficult or impossible today? Describe the situation, not the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Finding schema
        - Risk scoring
        - Control catalogs
        - Scanner interface
        - Emitters
        - CLI
        - Documentation
    validations:
      required: true
  - type: checkboxes
    id: breaking
    attributes:
      label: Compatibility
      options:
        - label: This changes the finding schema, and I understand it needs an ADR
