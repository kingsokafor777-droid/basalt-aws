name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install "basalt-core @ git+https://github.com/kingsokafor777-droid/basalt-core@3b57faa4d92fbeebc505da8e8597e3627dcd0f9d"
      - run: pip install -e ".[dev]"
      - run: ruff check --output-format=github .
      - run: ruff format --check .
      - run: mypy

  test:
    name: Test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install "basalt-core @ git+https://github.com/kingsokafor777-droid/basalt-core@3b57faa4d92fbeebc505da8e8597e3627dcd0f9d"
      - run: pip install -e ".[dev]"
      # No credentials configured. Every test runs against moto in-process; if a test
      # ever reaches real AWS it fails here rather than succeeding quietly.
      - run: pytest --cov --cov-report=term-missing -m "not live"

  contract:
    name: basalt-core contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install "basalt-core @ git+https://github.com/kingsokafor777-droid/basalt-core@3b57faa4d92fbeebc505da8e8597e3627dcd0f9d"
      - run: pip install -e ".[dev]"
      - name: Every declared control id resolves against the catalog
        run: |
          python - <<'PY'
          from basalt_aws import CHECKS
          from basalt_core import load_catalog
          catalog = load_catalog()
          bad = {c.rule_id: catalog.unknown(c.control_ids) for c in CHECKS if catalog.unknown(c.control_ids)}
          assert not bad, f"unresolved control ids: {bad}"
          print(f"{len(CHECKS)} checks, all control ids resolve")
          PY
      - name: Scanner is discoverable through the entry point
        run: |
          python -c "
          from basalt_core.plugin import discover_scanners
          from basalt_aws import AwsScanner
          assert discover_scanners().get('aws') is AwsScanner
          print('discovered via basalt.scanners entry point')"
      - name: Simulated scan converts to every format
        run: |
          python examples/scan_local.py
          python - <<'PY'
          import os, json
          os.environ.update(AWS_ACCESS_KEY_ID="t", AWS_SECRET_ACCESS_KEY="t", AWS_DEFAULT_REGION="ca-central-1")
          from moto import mock_aws
          from basalt_core import ScanContext, ScanResult, get_emitter
          from basalt_aws import AwsScanner
          with mock_aws():
              r = AwsScanner().run(ScanContext(regions=["ca-central-1"]))
          assert r.findings, "a bare account must still produce baseline findings"
          sarif = json.loads(get_emitter("sarif").emit_json(r))
          assert sarif["version"] == "2.1.0"
          ocsf = json.loads(get_emitter("ocsf").emit_json(r))
          assert all(e["class_uid"] == 2003 for e in ocsf)
          assert ScanResult.model_validate(json.loads(get_emitter("basalt").emit_json(r)))
          print(f"{len(r.findings)} findings converted to sarif, ocsf and native")
          PY

  readonly:
    name: Read-only assertion
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install "basalt-core @ git+https://github.com/kingsokafor777-droid/basalt-core@3b57faa4d92fbeebc505da8e8597e3627dcd0f9d"
      - run: pip install -e ".[dev]"
      - name: No mutating permission is requested
        run: |
          python - <<'PY'
          from basalt_aws.cli import REQUIRED_PERMISSIONS
          mutating = ("Create","Delete","Put","Update","Attach","Detach","Modify","Write","Enable","Disable")
          bad = [p for p in REQUIRED_PERMISSIONS if any(p.split(":")[1].startswith(m) for m in mutating)]
          assert not bad, f"mutating permissions requested: {bad}"
          print(f"all {len(REQUIRED_PERMISSIONS)} permissions are reads")
          PY
      - name: Terraform policy matches the declared permission set
        run: |
          python - <<'PY'
          import re, pathlib
          from basalt_aws.cli import REQUIRED_PERMISSIONS
          hcl = pathlib.Path("terraform/main.tf").read_text()
          declared = set(re.findall(r'"([a-z0-9]+:[A-Za-z]+)"', hcl))
          missing = set(REQUIRED_PERMISSIONS) - declared
          assert not missing, f"terraform policy is missing: {sorted(missing)}"
          print("terraform policy covers every declared permission")
          PY

  terraform:
    name: Terraform validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
      - run: terraform fmt -check -recursive
        working-directory: terraform
      - run: terraform init -backend=false
        working-directory: terraform
      - run: terraform validate
        working-directory: terraform

  build:
    name: Build distribution
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
